<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizens - OurEconomy</title><link rel="stylesheet" href="/css/style.css">
  <script src="/common/theme.js"></script>
</head>
<body>
  <oe-navbar current-page="users"></oe-navbar>

  <main class="container">
    <div class="page-header">
      <div><h1>Citizen Directory</h1><p>Active participants and registered economic actors.</p></div>
    </div>
    <div id="alertBox" class="alert"></div>
    <div class="card">
      <div class="card-header" style="flex-wrap: wrap; gap: 8px;">
        <span class="card-title">Registered Citizens</span>
        <select id="sortUsers" class="form-control" style="width: 130px; padding: 6px 8px;">
          <option value="id">Sort: ID</option><option value="username">Sort: Name</option>
        </select>
      </div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Citizen ID</th><th>Username</th><th>Joined Date</th><th>Status</th></tr></thead>
          <tbody id="usersTableBody"><tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading citizens...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <oe-footer></oe-footer>

  <script src="/common/config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/ui.js"></script>
  <script src="/common/navbar.js"></script>
  <script src="/common/footer.js"></script>
  <script src="/users/users.js"></script>
</body>
</html>
