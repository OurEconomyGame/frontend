<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join OurEconomy - Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: transparent;
      min-height: auto;
      padding: 12px;
      display: block;
    }
    .embed-card {
      max-width: 400px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="embed-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="font-size: 1.3rem;">Create Citizen Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Join the OurEconomy simulation</p>
    </div>
    <div id="alertBox" class="alert"></div>
    <form id="embedSignupForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" required placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required placeholder="Choose a secure password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
    </form>
  </div>
  <script src="/signup/embed.js"></script>
</body>
</html>
