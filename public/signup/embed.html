<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join OurEconomy - Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/common/theme.js"></script>
  <style>
    body { background: transparent; min-height: auto; padding: 12px; display: block; }
    .embed-card {
      max-width: 400px; width: 100%; margin: 0 auto;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="embed-card">
    <div style="text-align: center; margin-bottom: 12px;">
      <h2 style="font-size: 1.2rem;">Create Citizen Account</h2>
      <p style="font-size: 0.78rem; color: var(--text-muted);">Must be 13+ to participate in OurEconomy</p>
    </div>
    <div id="alertBox" class="alert"></div>
    <form id="embedSignupForm">
      <div class="form-group"><label for="username">Username</label><input type="text" id="username" class="form-control" required placeholder="Choose a username" /></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" class="form-control" required placeholder="••••••••" /></div>
      <p style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 10px;">
        By joining you confirm you are 13+ and accept the <a href="/terms/" target="_blank" style="color: var(--primary);">Terms</a> &amp; <a href="/privacy/" target="_blank" style="color: var(--primary);">Privacy Policy</a>.
      </p>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account (13+)</button>
    </form>
  </div>
  <script src="/signup/embed.js"></script>
</body>
</html>
