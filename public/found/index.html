<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found a Company - OurEconomy</title><link rel="stylesheet" href="/css/style.css">
  <script src="/common/theme.js"></script>
</head>
<body>
  <oe-navbar current-page="found"></oe-navbar>

  <main class="container">
    <div class="form-card" style="max-width: 520px;">
      <div class="page-header" style="margin-bottom: 20px;"><h2>Incorporate Enterprise</h2></div>
      <div id="alertBox" class="alert"></div>
      <form id="foundForm">
        <div class="form-group"><label for="companyName">Company Name</label><input type="text" id="companyName" class="form-control" required placeholder="e.g. Apex Minerals" /></div>
        <div class="form-group">
          <label for="companyType">Structure</label>
          <select id="companyType" class="form-control" required>
            <option value="0">🏭 Production Company ($500)</option><option value="1">🏛️ Holding Company ($2,000)</option><option value="2">🏪 WebStore ($750)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Establish Company</button>
      </form>
    </div>
  </main>

  <oe-footer></oe-footer>

  <script src="/common/consts.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/ui.js"></script>
  <script src="/common/navbar.js"></script>
  <script src="/common/footer.js"></script>
  <script src="/found/found.js"></script>
</body>
</html>
