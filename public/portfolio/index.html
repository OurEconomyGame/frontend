<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shareholder Portfolio - OurEconomy</title><link rel="stylesheet" href="/css/style.css">
  <script src="/common/theme.js"></script>
</head>
<body>
  <oe-navbar current-page="portfolio"></oe-navbar>

  <main class="container">
    <div class="page-header">
      <div><h1>Citizen Equity Portfolio</h1><p>Active corporate equity and dividend distribution rights.</p></div>
    </div>
    <div id="alertBox" class="alert"></div>
    <div class="card">
      <div class="card-header"><span class="card-title">Corporate Shareholdings</span></div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Company ID</th><th>Company Name</th><th>Shares Owned</th><th>Total Outstanding</th><th>Ownership %</th><th>Action</th></tr></thead>
          <tbody id="portfolioTableBody"><tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading portfolio...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <oe-footer></oe-footer>

  <script src="/common/config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/ui.js"></script>
  <script src="/common/navbar.js"></script>
  <script src="/common/footer.js"></script>
  <script src="/portfolio/portfolio.js"></script>
</body>
</html>
