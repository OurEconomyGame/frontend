<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OurEconomy</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <oe-navbar current-page="login"></oe-navbar>

  <main class="container">
    <div class="form-card">
      <div class="page-header" style="margin-bottom: 20px;"><h2>Citizen Login</h2></div>
      <div id="alertBox" class="alert"></div>
      <form id="loginForm">
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" class="form-control" required placeholder="Enter username" /></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" class="form-control" required placeholder="••••••••" /></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/signup/" style="color: var(--primary);">Sign up here</a>
      </p>
    </div>
  </main>

  <oe-footer></oe-footer>

  <script src="/common/config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/ui.js"></script>
  <script src="/common/navbar.js"></script>
  <script src="/common/footer.js"></script>
  <script src="/login/login.js"></script>
</body>
</html>
