<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companies - OurEconomy</title><link rel="stylesheet" href="/css/style.css">
  <script src="/common/theme.js"></script>
</head>
<body>
  <oe-navbar current-page="companies"></oe-navbar>

  <main class="container">
    <div class="page-header">
      <div><h1>Company Registry</h1><p>Commercial enterprises, holdings, and production facilities.</p></div>
      <a href="/found/" class="btn btn-primary">+ Found Company</a>
    </div>
    <div id="alertBox" class="alert"></div>
    <div class="card">
      <div class="card-header" style="flex-wrap: wrap; gap: 12px;">
        <span class="card-title">All Registered Companies</span>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <select id="typeSelect" class="form-control" style="width: 130px; padding: 6px 8px;">
            <option value="">All Types</option><option value="0">Production</option><option value="1">Holding</option><option value="2">WebStore</option>
          </select>
          <select id="sortSelect" class="form-control" style="width: 130px; padding: 6px 8px;">
            <option value="id">Sort: ID</option><option value="name">Sort: Name</option><option value="cash">Sort: Cash</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Treasury Cash</th><th>Shares</th><th>CEO</th><th>Actions</th></tr></thead>
          <tbody id="companiesTableBody"><tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading companies...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <oe-footer></oe-footer>

  <script src="/common/config.js"></script>
  <script src="/common/auth.js"></script>
  <script src="/common/ui.js"></script>
  <script src="/common/navbar.js"></script>
  <script src="/common/footer.js"></script>
  <script src="/companies/shift.js"></script>
  <script src="/companies/companies.js"></script>
</body>
</html>
