<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OurEconomy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">OE</div>
      <span class="brand-title">OurEconomy</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Dashboard</a></li>
      <li><a href="/companies/">Companies</a></li>
      <li><a href="/found/">Found</a></li>
      <li><a href="/market/">Market</a></li>
      <li><a href="/stores/">WebStores</a></li>
      <li><a href="/portfolio/">Portfolio</a></li>
      <li><a href="/users/">Citizens</a></li>
    </ul>
    <div class="nav-auth">
      <a href="/signup/" class="btn btn-primary btn-sm">Sign Up</a>
    </div>
  </nav>

  <main class="container">
    <div class="form-card">
      <div class="page-header" style="margin-bottom: 20px;">
        <h2>Citizen Login</h2>
      </div>
      <div id="alertBox" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/signup/" style="color: var(--primary);">Sign up here</a>
      </p>
    </div>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
